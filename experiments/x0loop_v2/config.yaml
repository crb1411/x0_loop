dataset:
  name: cifar10
  root: /mnt/data/crb/data
  download: false
  normalization: standard
model:
  name: jit
  image_size: 32
  in_channels: 3
  out_channels: 3
  patch_size: 4
  dim: 512
  depth: 12
  heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  num_classes: 10
  cond_dim: 0
  bottleneck_dim: 128
  in_context_len: 32
  in_context_start: 4
process:
  name: flow
  output_target: x0
  sampler: heun
  endpoint: learnable_mu
  endpoint_beta: 0.8
  predict_mudata: false
  mudata_init_mean: 0.0
  mudata_init_std: 1.0
schedule:
  mode: flow
time_sampler:
  name: logit_normal
  mean: 0.0
  std: 1.0
  min_t: 0.001
  max_t: 0.999
time_condition_jitter:
  enabled: true
  mean: 0.02
  std: 0.02
  prob: 1.0
  min_t: 0.001
  max_t: 0.999
model_conditioning:
  ignore_time: true
  time_constant: 0.5
clean_loop:
  enabled: false
  version: 2
  mode: bank_fix
  bank_size: 4096
  warmup_steps: 0
  aux_batch_ratio: 0.25
  aux_gradient_ratio: 0.2
  aux_scale_max: 10.0
  solver_steps: 20
  sampler: heun
  guidance_scale: 2.2
  root_fraction: 0.25
  drop_fraction: 0.5
loss:
  outer_weight: skew_triangular
  outer_weight_power: 1.0
  outer_weight_floor: 0.0
  outer_weight_skew: 0.22
  terms:
    - target: v
      formula: mse
      coef: 1.0
augment:
  name: geom
  mode: data_only
  hflip_prob: 0.5
  max_translation: 0
  crop_min_scale: 1.0
  enable_crop_resize: false
train:
  seed: 42
  deterministic: false
  epochs: 500
  run_steps: 5000
  batch_size: 256
  gradient_accumulation_steps: 1
  class_dropout_prob: 0.10
  num_workers: 8
  lr: 5.0e-05
  lr_scheduler:
    name: constant
  weight_decay: 0.01
  max_clip_grad: 10.0
  use_ema: true
  ema_decay: 0.996
  resume: null
logging:
  log_every: 10
  window_size: 20
  use_tb: true
  sample_every: 10000
  sample_rank0_only: true
  summary_include_x0: true
  out_dir: null
eval:
  enabled: false
gen_eval:
  enabled: false
  final:
    enabled: false
distributed:
  mode: none
  backend: nccl
  fsdp: false
  fsdp_mode: none
  precision: bf16
  grad_clip_norm: 3.0
  activation_ckpt: false
  checkpoint:
    mode: full
    every_steps: 5000
compile:
  enabled: false
