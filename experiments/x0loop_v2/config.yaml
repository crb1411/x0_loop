dataset:
  name: cifar10
  root: /mnt/data/crb/data
  download: false
  normalization: standard
research:
  principles_version: v1
  launch_branch: null
  git_commit: null
  git_dirty: null
model:
  name: jit
  image_size: 32
  in_channels: 3
  out_channels: 3
  patch_size: 4
  dim: 512
  depth: 12
  heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  num_classes: 10
  cond_dim: 0
  bottleneck_dim: 128
  in_context_len: 32
  in_context_start: 4
process:
  name: flow
  output_target: x0
  sampler: heun
  endpoint: learnable_mu
  endpoint_beta: 0.8
  predict_mudata: false
  mudata_init_mean: 0.0
  mudata_init_std: 1.0
schedule:
  mode: flow
time_sampler:
  name: logit_normal
  mean: 0.0
  std: 1.0
  min_t: 0.001
  max_t: 0.999
time_condition_jitter:
  enabled: true
  mean: 0.02
  std: 0.02
  prob: 1.0
  min_t: 0.001
  max_t: 0.999
model_conditioning:
  ignore_time: true
  time_constant: 0.5
solver_correction:
  enabled: false
  solver_steps: 20
  start_index: 16
  hidden_channels: 32
  output_scale: 1.0
clean_loop:
  enabled: false
  version: 2
  mode: bank_fix
  bank_size: 4096
  warmup_steps: 0
  aux_batch_ratio: 0.25
  aux_gradient_ratio: 0.2
  aux_gradient_space: output
  aux_scale_max: 10.0
  # Preserve the Cycle 01 definition in the base config. The explicit
  # bank-x0/online-x0 launch branches override this to native x0 distillation.
  aux_target: velocity
  teacher_mode: moving
  teacher_checkpoint: null
  solver_steps: 20
  sampler: heun
  guidance_scale: 2.2
  root_fraction: 0.25
  refresh_interval: 1
  drop_fraction: 0.5
adversarial:
  enabled: false
  # Cycle 03 launch branches override fake_space while sharing discriminator,
  # batch, warmup, and output-gradient controls.
  fake_space: x0_hat
  loss: hinge
  weight: 1.0
  start_step: 10000
  warmup_steps: 1000
  update_every: 1
  d_steps: 1
  batch_ratio: 0.125
  gradient_ratio: 0.10
  scale_max: 10.0
  clamp_fake_for_d: false
  t_weight:
    name: piecewise
  r1:
    gamma: 1.0
    interval: 16
  terminal:
    steps: 20
    sampler: heun
    guidance_scale: 2.2
distribution_matching:
  enabled: false
  objective: inception_kid
  weight: 1.0
  start_step: 10000
  warmup_steps: 1000
  batch_ratio: 0.0625
  gradient_ratio: 0.10
  scale_max: 10.0
  degree: 3
  terminal:
    steps: 20
    sampler: heun
    guidance_scale: 2.2
    suffix_steps: 4
discriminator:
  name: x0_resnet
  base_channels: 16
  spectral_norm: true
  time_projection: true
  class_projection: true
  lr: 2.0e-4
  weight_decay: 0.0
  betas: [0.0, 0.99]
loss:
  outer_weight: skew_triangular
  outer_weight_power: 1.0
  outer_weight_floor: 0.0
  outer_weight_skew: 0.22
  terms:
    - target: v
      formula: mse
      coef: 1.0
augment:
  name: geom
  mode: data_only
  hflip_prob: 0.5
  max_translation: 0
  crop_min_scale: 1.0
  enable_crop_resize: false
train:
  seed: 42
  deterministic: false
  epochs: 300
  run_steps: 5000
  batch_size: 256
  gradient_accumulation_steps: 1
  class_dropout_prob: 0.10
  num_workers: 8
  lr: 5.0e-05
  lr_scheduler:
    name: constant
  weight_decay: 0.01
  fused_optimizer: true
  max_clip_grad: 10.0
  use_ema: true
  ema_decay: 0.996
  resume: null
logging:
  log_every: 10
  window_size: 20
  use_tb: true
  sample_every: 10000
  sample_rank0_only: true
  summary_include_x0: true
  out_dir: null
eval:
  enabled: false
gen_eval:
  # FID is the primary iteration objective. Use a cheaper fixed-noise 5k FID
  # at sparse decision gates, then one 50k FID at the end.
  enabled: true
  every_steps: 15000
  seed: 20260819
  num_samples: 5000
  batch_size: 256
  steps: 20
  sampler: heun
  guidance_scale: 2.2
  guidance_schedule: null
  input2: cifar10-train
  datasets_root: /mnt/data/crb/data
  datasets_download: false
  keep_images: false
  metrics:
    isc: false
    fid: true
    kid: false
    ppl: false
    prc: false
    mind: false
  final:
    enabled: true
    num_samples: 50000
    batch_size: 256
    steps: 20
    sampler: heun
    guidance_scale: 2.2
    guidance_schedule: null
distributed:
  mode: none
  backend: nccl
  fsdp: false
  fsdp_mode: none
  precision: bf16
  grad_clip_norm: 3.0
  activation_ckpt: false
  checkpoint:
    mode: full
    every_steps: 500
compile:
  enabled: false
