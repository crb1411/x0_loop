dataset:
  name: cifar10
  root: /root/data/cifar10_data

model:
  image_size: 32
  in_channels: 3
  out_channels: 3
  patch_size: 4
  dim: 384
  depth: 8
  heads: 6
  mlp_ratio: 4.0
  dropout: 0.0
  num_classes: 10 # 0 disables class conditioning; when >0, label id num_classes is the CFG null label

process:
  name: flow

schedule:
  mode: flow
  num_steps: 1000

loss:
  target: v
  formula: mse

augment:
  name: geom
  mode: data_only
  hflip_prob: 0.5
  max_translation: 0
  crop_min_scale: 1.0
  enable_crop_resize: false
train:
  seed: 42
  deterministic: false
  epochs: 400
  batch_size: 256
  gradient_accumulation_steps: 1
  class_dropout_prob: 0.1 # [0,1], replace class label with CFG null label during training
  num_workers: 8
  lr: 2.0e-4
  weight_decay: 0.05
  use_ema: true
  ema_decay: 0.9999
  resume: null

logging:
  out_dir: runs/cifar10_flow
  log_every: 50
  window_size: 20
  use_tb: true
  sample_every: 2000
  sample_rank0_only: true

sample:
  steps: 50
  num: 16
  sampler: auto # ignored for flow process; kept for config compatibility
  guidance_scale: 1.0 # 1.0 disables CFG; >1 uses conditional + null-label unconditional prediction
  posterior_noise_scale: 1.0 # ignored for flow process
  save_trace: true
