distributed:
  backend: nccl
  fsdp: true
  fsdp_mode: fsdp2
  sharding: full_shard
  precision: bf16
  grad_clip_norm: 3.0
  activation_ckpt: true
  checkpoint:
    mode: sharded
    every_steps: 10000

compile:
  enabled: true
  allow_fsdp: true
  mode: default
  fullgraph: false
  dynamic: false
