dataset:
  name: mnist
  root: /root/data/mnist
  download: false

model:
  image_size: 28
  in_channels: 1
  out_channels: 1
  patch_size: 4
  dim: 256
  depth: 6
  heads: 4
  mlp_ratio: 4.0
  dropout: 0.0
  norm_layer: rmsnorm

process:
  name: diffusion
  sampler: ddim # ddim | posterior
  posterior_noise_scale: 1.0 # used when sampler=posterior

schedule:
  mode: diffusion
  num_steps: 1000
  diffusion_lambda: 12.0

loss:
  name: weighted # mse | l1 | huber | weighted | composite
  inner: mse # mse | l1 | huber (used when name=weighted)
  weight: balance_weights # snr | inv_snr | logsnr | balance_weights
  balance_factor: 0.2 # [0,1], used when weight=balance_weights
  balance_time: auto # auto | discrete | continuous (used when weight=balance_weights)
  balance_integral_steps: 1000 # used when balance_time=continuous
  dual_x0: true # false | true, add x0 reconstruction MSE term
  dual_balance_factor: 0.5 # [0,1], total=(1-b)*L_eps + b*L_x0; b=0 means original eps-only loss


augment:
  name: none

train:
  seed: 42
  deterministic: false
  epochs: 2000000
  batch_size: 256
  num_workers: 8
  lr: 5.0e-5
  lr_scheduler:
    name: cosine # constant | cosine
    max_lr: 5.0e-5 # peak lr
    min_lr: 1.0e-6 # floor lr
    warmup_steps: 5000 # linear warmup: min_lr -> max_lr
    cosine_steps: 100000 # cosine decay: max_lr -> min_lr, then hold min_lr
  weight_decay: 0.02
  max_clip_grad: 10.0
  use_ema: true
  ema_decay: 0.996
  resume: null

logging:
  out_dir: runs/mnist_diffusion
  log_every: 500
  window_size: 500
  use_tb: true
  sample_every: 10000
  sample_rank0_only: true
  summary_include_x0: true

sample:
  steps: 1000
  num: 2
  sampler: auto # auto | ddim | posterior (auto uses process.sampler)
  posterior_noise_scale: 1.0 # used when sampler=posterior
  save_trace: false

distributed:
  checkpoint:
    mode: sharded
    every_steps: 10000
