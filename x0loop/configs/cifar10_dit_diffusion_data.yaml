dataset:
  name: cifar10
  root: /data/cifar10_data
  download: false

model:
  image_size: 32
  in_channels: 3
  out_channels: 3
  patch_size: 4
  dim: 384
  depth: 8
  heads: 6
  mlp_ratio: 4.0
  dropout: 0.0
  norm_layer: layernorm

process:
  name: diffusion
  sampler: ddim # ddim | posterior
  posterior_noise_scale: 1.0 # used when sampler=posterior

schedule:
  mode: diffusion
  num_steps: 1000
  diffusion_lambda: 12.0

loss:
  name: mse

augment:
  name: geom
  mode: data_only
  hflip_prob: 0.5
  max_translation: 2
  crop_min_scale: 1.0
  enable_crop_resize: false

train:
  seed: 42
  deterministic: false
  epochs: 400
  batch_size: 256
  num_workers: 8
  lr: 1.0e-4
  lr_scheduler:
    name: cosine # constant | cosine
    max_lr: 1.0e-4 # peak lr
    min_lr: 1.0e-6 # floor lr
    warmup_steps: 5000 # linear warmup: min_lr -> max_lr
    cosine_steps: 100000 # cosine decay: max_lr -> min_lr, then hold min_lr
  weight_decay: 0.04
  max_clip_grad: 10.0
  use_ema: true
  ema_decay: 0.999
  resume: null

logging:
  out_dir: runs/cifar10_diffusion_data
  log_every: 100
  window_size: 100
  use_tb: true
  sample_every: 5000
  sample_rank0_only: true
  summary_include_x0: false

sample:
  steps: 100
  num: 16
  sampler: auto # auto | ddim | posterior (auto uses process.sampler)
  posterior_noise_scale: 1.0 # used when sampler=posterior
  save_trace: false
