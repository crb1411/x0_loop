dataset:
  name: mnist
  root: /root/data/mnist
  download: false

model:
  image_size: 28
  in_channels: 1
  out_channels: 1
  patch_size: 4
  dim: 256
  depth: 6
  heads: 4
  mlp_ratio: 4.0
  dropout: 0.0
  norm_layer: layernorm
  num_classes: 10 # 0 disables class conditioning; when >0, label id num_classes is the CFG null label

process:
  name: diffusion
  sampler: ddim # ddim | posterior
  posterior_noise_scale: 1.0 # used when sampler=posterior

schedule:
  mode: diffusion
  num_steps: 1000
  beta_min: 0.1
  beta_max: 20.0

loss:
  terms:
    - target: eps
      formula: mse
      weight: balance_weights
      balance_factor: 0.3
      balance_time: auto
      balance_integral_steps: 2000
      coef: 0.5
    - target: x0
      formula: mse
      weight: balance_weights
      balance_factor: 0.3
      balance_time: auto
      balance_integral_steps: 2000
      coef: 0.5


augment:
  name: none

train:
  seed: 42
  deterministic: false
  epochs: 2000000
  batch_size: 256
  gradient_accumulation_steps: 1
  class_dropout_prob: 0.1 # [0,1], replace class label with CFG null label during training
  num_workers: 8
  lr: 5.0e-5
  lr_scheduler:
    name: cosine # constant | cosine
    max_lr: 5.0e-5 # peak lr
    min_lr: 1.0e-7 # floor lr
    warmup_steps: 5000 # linear warmup: min_lr -> max_lr
    cosine_steps: 100000 # cosine decay: max_lr -> min_lr, then hold min_lr
  weight_decay: 0.02
  max_clip_grad: 10.0
  use_ema: true
  ema_decay: 0.999
  resume: null

logging:
  out_dir_base: runs/mnist_diffusion
  log_every: 100
  window_size: 100
  use_tb: true
  sample_every: 5000
  sample_rank0_only: true
  summary_include_x0: true

sample:
  steps: 100
  num: 4
  sampler: auto # auto | ddim | posterior (auto uses process.sampler)
  guidance_scale: 1.0 # 1.0 disables CFG; >1 uses conditional + null-label unconditional prediction
  posterior_noise_scale: 1.0 # used when sampler=posterior
  save_trace: false
