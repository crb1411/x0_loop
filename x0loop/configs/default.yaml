dataset:
  name: tiny-imagenet # cifar10 | mnist | imagefolder | tiny-imagenet | tiny_imagenet
  root: /root/data/tiny-imagenet-200
  split: train # train | val | test, used by imagefolder/tiny-imagenet when split subdir exists

model:
  image_size: 64
  in_channels: 3
  out_channels: 3
  patch_size: 4
  dim: 384
  depth: 8
  heads: 6
  mlp_ratio: 4.0
  dropout: 0.0
  norm_layer: layernorm # layernorm | ln | rmsnorm | rms
  num_classes: 200 # 0 disables class conditioning; when >0, label id num_classes is the CFG null label

process:
  name: diffusion # diffusion | flow
  output_target: eps # eps | x0 | v  — what the model directly predicts
  sampler: ddim # ddim | posterior
  posterior_noise_scale: 1.0 # used when sampler=posterior

schedule:
  mode: diffusion # diffusion | flow
  num_steps: 1000
  beta_min: 0.1
  beta_max: 20.0

loss:
  terms:
    - target: eps   # eps | x0 | v
      formula: mse  # mse | l1 | huber
      weight: none  # none | snr | inv_snr | logsnr | balance_weights
      balance_factor: 0.0
      balance_time: auto
      balance_integral_steps: 1000
      coef: 0.5
    - target: x0
      formula: mse
      weight: none
      balance_factor: 0.0
      balance_time: auto
      balance_integral_steps: 1000
      coef: 0.5

augment:
  name: geom
  mode: data_only
  hflip_prob: 0.5
  max_translation: 0
  crop_min_scale: 1.0
  enable_crop_resize: false
train:
  seed: 42
  deterministic: false # false | true
  epochs: 1000000
  batch_size: 256
  gradient_accumulation_steps: 2
  class_dropout_prob: 0.1 # [0,1], replace class label with CFG null label during training
  num_workers: 8
  lr: 5.0e-5 # used when lr_scheduler.name=constant, and as fallback max/init value
  lr_scheduler:
    name: cosine # none | constant | cosine
    max_lr: 8.0e-5 # peak lr
    min_lr: 1.0e-6 # floor lr
    warmup_steps: 50000 # linear warmup: min_lr -> max_lr
    cosine_steps: 200000 # cosine decay: max_lr -> min_lr, then hold min_lr
  weight_decay: 0.04
  max_clip_grad: 10.0 # overrides distributed.grad_clip_norm when set
  use_ema: true # false | true
  ema_decay: 0.996
  resume: null

logging:
  log_every: 100
  window_size: 500
  use_tb: true # false | true
  sample_every: 5000
  sample_rank0_only: true # false | true
  summary_include_x0: true # kept for compatibility; tbin now always shows eps/x0/v

sample:
  steps: 100
  num: 4
  sampler: auto # auto | ddim | posterior (auto uses process.sampler)
  guidance_scale: 5.0 # 1.0 disables CFG; >1 uses conditional + null-label unconditional prediction
  posterior_noise_scale: 1.0 # used when sampler=posterior
  save_trace: false # false | true
