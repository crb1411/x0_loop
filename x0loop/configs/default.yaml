dataset:
  name: tiny-imagenet
  root: /root/data/tiny-imagenet-200
  split: train

model:
  image_size: 64
  in_channels: 3
  out_channels: 3
  patch_size: 4
  dim: 384
  depth: 8
  heads: 6
  mlp_ratio: 4.0
  dropout: 0.0
  norm_layer: layernorm

process:
  name: diffusion
  sampler: ddim # ddim | posterior
  posterior_noise_scale: 1.0 # used when sampler=posterior

schedule:
  mode: diffusion
  num_steps: 1000
  diffusion_lambda: 12.0

loss:
  name: weighted # mse | l1 | huber | weighted | composite
  inner: mse # mse | l1 | huber (used when name=weighted)
  weight: balance_weights # snr | inv_snr | logsnr | balance_weights
  balance_factor: 0.3 # [0,1], used when weight=balance_weights
  balance_time: auto # auto | discrete | continuous (used when weight=balance_weights)
  balance_integral_steps: 1000 # used when balance_time=continuous
  dual_x0: true # false | true, add x0 reconstruction MSE term
  dual_balance_factor: 0.5 # [0,1], total=(1-b)*L_eps + b*L_x0; b=0 means original eps-only loss

augment:
  name: geom
  mode: data_only
  hflip_prob: 0.5
  max_translation: 2
  crop_min_scale: 0.9
  enable_crop_resize: true

train:
  seed: 42
  deterministic: false
  epochs: 1000000
  batch_size: 256
  num_workers: 8
  lr: 5.0e-5 # used when lr_scheduler.name=constant, and as fallback max/init value
  lr_scheduler:
    name: cosine # constant | cosine
    max_lr: 5.0e-5 # peak lr
    min_lr: 1.0e-6 # floor lr
    warmup_steps: 80000 # linear warmup: min_lr -> max_lr
    cosine_steps: 200000 # cosine decay: max_lr -> min_lr, then hold min_lr
  weight_decay: 0.04
  max_clip_grad: 10.0 # overrides distributed.grad_clip_norm when set
  use_ema: true
  ema_decay: 0.996
  resume: null

logging:
  out_dir: runs/exp_default
  log_every: 100
  window_size: 100
  use_tb: true
  sample_every: 5000
  sample_rank0_only: true
  summary_include_x0: true # when dual_x0 is enabled, include lx0/lx0_avg in summary

sample:
  steps: 100
  num: 4
  sampler: auto # auto | ddim | posterior (auto uses process.sampler)
  posterior_noise_scale: 1.0 # used when sampler=posterior
  save_trace: false
