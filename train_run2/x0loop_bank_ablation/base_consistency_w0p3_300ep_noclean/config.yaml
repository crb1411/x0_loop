dataset:
  name: cifar10
  root: /root/data/cifar10_data
  download: false
  normalization: standard
model:
  name: jit
  image_size: 32
  in_channels: 3
  out_channels: 3
  patch_size: 4
  dim: 512
  depth: 12
  heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  num_classes: 10
  cond_dim: 0
  bottleneck_dim: 128
  in_context_len: 32
  in_context_start: 4
process:
  name: flow
  output_target: x0
  sampler: heun
  endpoint: learnable_mu
  endpoint_beta: 0.8
  predict_mudata: false
  mudata_init_mean: 0.0
  mudata_init_std: 1.0
schedule:
  mode: flow
time_sampler:
  name: logit_normal
  mean: 0.0
  std: 1.0
  min_t: 0.001
  max_t: 0.999
time_condition_jitter:
  enabled: false
  mean: 0.02
  std: 0.02
  prob: 1.0
  min_t: 0.001
  max_t: 0.999
model_conditioning:
  ignore_time: false
clean_loop:
  enabled: false
  bank_size: 4096
  bank_prob: 0.30
  warmup_steps: 10000
  loss_bank_weight: 0.3
  t_bank: 0.4
  bank_input_mode: step
  t1_sampler: fixed_delta
  t1_delta: 0.2
  t1_min: 1.0e-5
  max_bank_readd_age: 1
  bank_loss:
    target: v
    formula: mse
    use_weight: true
consistency_training:
  enabled: true
  consistent_weight: 0.3
  target: v
  order_times: true
loss:
  outer_weight: skew_triangular
  outer_weight_power: 1.0
  outer_weight_floor: 0.0
  outer_weight_skew: 0.22
  terms:
  - target: v
    formula: mse
    coef: 1.0
augment:
  name: geom
  mode: data_only
  hflip_prob: 0.5
  max_translation: 0
  crop_min_scale: 1.0
  enable_crop_resize: false
train:
  seed: 42
  deterministic: false
  epochs: 300
  batch_size: 256
  gradient_accumulation_steps: 1
  class_dropout_prob: 0.10
  num_workers: 8
  lr: 0.00030
  lr_scheduler:
    name: cosine
    max_lr: 0.00030
    min_lr: 5.0e-05
    warmup_steps: 10000
    cosine_steps: 50000
  weight_decay: 0.01
  max_clip_grad: 10.0
  use_ema: true
  ema_decay: 0.996
logging:
  log_every: 100
  window_size: 100
  # mudata_every: 3000
  use_tb: true
  sample_every: 10000
  sample_rank0_only: true
  summary_include_x0: true
  out_dir: null
trainset_observe:
  enabled: true
  every_steps: 3000
  num: 10
  dir: trainset_observe
  cols: 5
  scale: 3
eval:
  enabled: true
  every_steps: 1000
  max_batches: 8
  batch_size: 256
  num_workers: 4
sample:
  steps: 50
  num: 5
  sampler: heun
  guidance_scale: 1.0
  save_trace: false
gen_eval:
  enabled: true
  every_steps: 10000
  num_samples: 5000
  batch_size: 256
  steps: 20
  sampler: heun
  guidance_scale: 2.2
  guidance_schedule: null
  input2: cifar10-train
  datasets_root: /root/data/cifar10_data
  datasets_download: false
  keep_images: false
  metrics:
    isc: true
    fid: true
    kid: true
    ppl: false
    prc: true
    mind: true
  final:
    enabled: true
    num_samples: 50000
    batch_size: 256
    steps: 20
    sampler: heun
    guidance_scale: 2.2
    guidance_schedule: null
distributed:
  mode: ddp
  backend: nccl
  fsdp: false
  fsdp_mode: none
  precision: bf16
  grad_clip_norm: 3.0
  activation_ckpt: false
  ddp:
    broadcast_buffers: false
    find_unused_parameters: false
    gradient_as_bucket_view: false
    static_graph: false
  checkpoint:
    mode: full
    every_steps: 30000
compile:
  enabled: true
  allow_fsdp: false
  mode: default
  fullgraph: false
  dynamic: false
_config_path: /data/seek/aigc/x0_loop/train_run2/x0loop_bank_ablation/base_consistency_w0p3_300ep_noclean/config.yaml
_runtime_config_path: /data/seek/aigc/x0_loop/x0loop/configs/runtime/ddp_checkpoint_compile.yaml
