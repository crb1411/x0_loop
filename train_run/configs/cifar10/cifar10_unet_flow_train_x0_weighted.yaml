dataset:
  name: cifar10
  root: /root/data/cifar10_data
  download: false

model:
  name: unet
  image_size: 32
  in_channels: 3
  out_channels: 3
  base_channels: 104
  channel_mult: [1, 2, 2, 4]
  num_res_blocks: 3
  dropout: 0.0
  num_classes: 10
  cond_dim: 0
  time_dim_mult: 4
  attention_resolutions: [16, 8]
  attention_heads: 4

process:
  name: flow
  output_target: x0
  sampler: ddim
  posterior_noise_scale: 1.0

schedule:
  mode: flow

time_sampler:
  name: uniform_continuous

loss:
  outer_weight: target
  outer_weight_power: 2.0
  outer_weight_floor: 0.0

  terms:
    - {target: x0, formula: mse, coef: 1.0}

augment:
  name: geom
  mode: data_only
  hflip_prob: 0.5
  max_translation: 0
  crop_min_scale: 1.0
  enable_crop_resize: false
train:
  seed: 42
  deterministic: false
  epochs: 1000
  batch_size: 256
  gradient_accumulation_steps: 1
  class_dropout_prob: 0.1
  num_workers: 8
  lr: 1.0e-4
  lr_scheduler:
    name: cosine
    max_lr: 1.0e-4
    min_lr: 3.0e-5
    warmup_steps: 10000
    cosine_steps: 100000
  weight_decay: 0.04
  max_clip_grad: 10.0
  use_ema: true
  ema_decay: 0.999
  resume: null

logging:
  log_every: 100
  window_size: 100
  use_tb: true
  sample_every: 10000
  sample_rank0_only: true
  summary_include_x0: true

eval:
  enabled: true
  every_steps: 1000
  max_batches: 8
  batch_size: 256
  num_workers: 4

sample:
  steps: 50
  num: 5
  sampler: ddim
  guidance_scale: 1.0
  posterior_noise_scale: 1.0
  save_trace: false
