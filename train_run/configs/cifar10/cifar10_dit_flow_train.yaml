dataset:
  name: cifar10 # cifar10 | mnist | imagefolder | tiny-imagenet | tiny_imagenet
  root: /root/data/cifar10_data
  download: false # false | true

model:
  image_size: 32
  in_channels: 3
  out_channels: 3
  patch_size: 4
  dim: 384
  depth: 8
  heads: 6
  mlp_ratio: 4.0
  dropout: 0.0
  norm_layer: layernorm # layernorm | ln | rmsnorm | rms
  num_classes: 10 # 0 disables class conditioning; when >0, label id num_classes is the CFG null label

process:
  name: flow # diffusion | flow
  output_target: x0 # eps | x0 | v  — what the model directly predicts
  sampler: ddim # ddim | posterior
  posterior_noise_scale: 1.0 # used when sampler=posterior

schedule:
  mode: flow # diffusion | flow

loss:
  terms:
    - {target: eps, formula: mse, coef: 0.5}
    - {target: x0,  formula: mse, coef: 0.5}

augment:
  name: geom # none | geom | dit | dit_original | strongaugment | strong
  mode: data_only # data_only
  hflip_prob: 0.2
  max_translation: 0
  crop_min_scale: 0.8
  enable_crop_resize: true # false | true

train:
  seed: 42
  deterministic: false # false | true
  epochs: 1000
  batch_size: 256
  gradient_accumulation_steps: 1
  class_dropout_prob: 0.1 # [0,1], replace class label with CFG null label during training
  num_workers: 8
  lr: 1.0e-4 # used when lr_scheduler.name=constant, and as fallback max/init value
  lr_scheduler:
    name: cosine # none | constant | cosine
    max_lr: 1.0e-4 # peak lr
    min_lr: 1.0e-6 # floor lr
    warmup_steps: 10000 # linear warmup: min_lr -> max_lr
    cosine_steps: 100000 # cosine decay: max_lr -> min_lr, then hold min_lr
  weight_decay: 0.04
  max_clip_grad: 10.0 # overrides distributed.grad_clip_norm when set
  use_ema: true # false | true
  ema_decay: 0.999
  resume: null

logging:
  log_every: 100
  window_size: 100
  use_tb: true # false | true
  sample_every: 10000
  sample_rank0_only: true # false | true
  summary_include_x0: true # tbin now always shows eps/x0/v

sample:
  steps: 50
  num: 16
  sampler: ddim # auto | ddim | posterior (auto uses process.sampler)
  guidance_scale: 1.0 # 1.0 disables CFG; >1 uses conditional + null-label unconditional prediction
  posterior_noise_scale: 1.0 # used when sampler=posterior
  save_trace: false # false | true
