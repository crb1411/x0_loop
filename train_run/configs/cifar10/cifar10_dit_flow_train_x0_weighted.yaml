dataset:
  name: cifar10
  root: /root/data/cifar10_data
  download: false

model:
  image_size: 32
  in_channels: 3
  out_channels: 3
  patch_size: 4
  dim: 512
  depth: 12
  heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  norm_layer: layernorm
  num_classes: 10

process:
  name: flow
  output_target: x0
  sampler: ddim
  posterior_noise_scale: 1.0

schedule:
  mode: flow

loss:
  outer_weight: x0
  outer_weight_power: 0.5
  outer_weight_floor: 0.0

  terms:
    - {target: x0, formula: mse, coef: 1.0}

augment:
  name: geom
  mode: data_only
  hflip_prob: 0.5
  max_translation: 0
  crop_min_scale: 0.6
  enable_crop_resize: true

train:
  seed: 42
  deterministic: false
  epochs: 1000
  batch_size: 256
  gradient_accumulation_steps: 1
  class_dropout_prob: 0.1
  num_workers: 8
  lr: 1.0e-4
  lr_scheduler:
    name: cosine
    max_lr: 1.0e-4
    min_lr: 3.0e-5
    warmup_steps: 10000
    cosine_steps: 100000
  weight_decay: 0.04
  max_clip_grad: 10.0
  use_ema: true
  ema_decay: 0.999
  resume: null

logging:
  out_dir_base: runs/cifar10_flow_weighted_x0
  log_every: 100
  window_size: 100
  use_tb: true
  sample_every: 10000
  sample_rank0_only: true
  summary_include_x0: true

sample:
  steps: 50
  num: 5
  sampler: ddim
  guidance_scale: 1.0
  posterior_noise_scale: 1.0
  save_trace: false
